<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大肥鱼 · 记忆星河 Bloom Lab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="galaxy-lab.css">
</head>
<body>
  <div id="stage" aria-label="大肥鱼记忆星河 Bloom 实验版"></div>
  <div id="labels" class="labels" aria-hidden="true"></div>

  <header class="hud">
    <div class="title-row">
      <div>
        <h1>记忆星河 <span class="lab-tag">BLOOM</span></h1>
        <p class="subtitle" id="subtitle">正在点亮…</p>
      </div>
      <div class="view-links">
        <a class="switch" href="index.html">稳定版</a>
        <span class="live-dot" title="本地只读"></span>
      </div>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="搜一条记忆、一个标签…" autocomplete="off">
      <button id="reset" type="button" title="重置视角">重置</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <aside id="panel" class="panel" aria-live="polite">
    <button id="close" class="close" type="button" aria-label="关闭详情">×</button>
    <div id="panel-body">
      <p class="empty">点一颗星，看看它记得什么。</p>
    </div>
  </aside>

  <div class="legend">
    <span><i class="dot core"></i>核心</span>
    <span><i class="dot memory"></i>记忆</span>
    <span><i class="dot event"></i>事件</span>
    <span><i class="dot tag"></i>标签</span>
  </div>

  <footer class="hint">拖拽旋转 · 滚轮缩放 · 点击亮星查看记忆 · 实验版</footer>
  <div id="loader" class="loader">正在点亮记忆…</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/jsm/"
      }
    }
  </script>
  <script type="module" src="galaxy-lab.js"></script>
</body>
</html>
